name: build README

on:
  push:
    branches:
      - master

  schedule:
    - cron: "0 0 * * *"

  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: "pip"
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python generate.py

      - name: Commit and push changes
        run: |
          git config --global user.name "ddjerqq"
          git config --global user.email "57017344+ddjerqq@users.noreply.github.com"
          git add .
          git commit -m "Updated README [skip ci]" && git push